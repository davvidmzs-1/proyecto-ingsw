<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="Arial, Helvetica, sans-serif">
  <title>Mockup de baja fidelidad: Panel de habitaciones</title>
  <defs>
    <pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e6e6e6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b5b5b5" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- Ventana -->
  <rect x="1" y="1" width="818" height="558" fill="#ffffff" stroke="#555" stroke-width="2"/>

  <!-- Barra superior -->
  <rect x="1" y="1" width="818" height="50" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
  <text x="20" y="32" font-size="18" font-weight="bold" fill="#333">Panel de habitaciones</text>
  <text x="520" y="32" font-size="13" fill="#333">17/11 · 21:40</text>
  <text x="625" y="32" font-size="13" fill="#333">Usuario: recepción ▾</text>
  <rect x="760" y="15" width="45" height="22" fill="#fff" stroke="#777"/>
  <text x="768" y="31" font-size="12" fill="#333">Salir</text>

  <!-- Resumen y acciones -->
  <text x="20" y="80" font-size="13" fill="#333">Libres: 3 · Ocupadas: 3 · En limpieza: 1 · Reservadas: 1</text>
  <rect x="560" y="62" width="120" height="28" fill="#bfbfbf" stroke="#555"/>
  <text x="575" y="81" font-size="13" fill="#222">+ Nueva reserva</text>
  <rect x="690" y="62" width="115" height="28" fill="#fff" stroke="#555"/>
  <text x="705" y="81" font-size="13" fill="#222">Filtrar estado ▾</text>

  <!-- Fila 1 -->
  <g>
    <rect x="20" y="105" width="185" height="150" fill="#ffffff" stroke="#555" stroke-width="2"/>
    <text x="35" y="135" font-size="20" font-weight="bold" fill="#222">Hab. 1</text>
    <text x="35" y="155" font-size="12" fill="#666">Estándar</text>
    <rect x="35" y="168" width="80" height="22" fill="#fff" stroke="#555"/>
    <text x="48" y="184" font-size="12" font-weight="bold" fill="#222">LIBRE</text>
    <rect x="35" y="210" width="155" height="30" fill="#e0e0e0" stroke="#777"/>
    <text x="78" y="230" font-size="13" fill="#222">Check-in</text>
  </g>
  <g>
    <rect x="220" y="105" width="185" height="150" fill="#9e9e9e" stroke="#333" stroke-width="2"/>
    <text x="235" y="135" font-size="20" font-weight="bold" fill="#111">Hab. 2</text>
    <text x="235" y="155" font-size="12" fill="#222">Suite</text>
    <rect x="235" y="168" width="90" height="22" fill="#555" stroke="#333"/>
    <text x="245" y="184" font-size="12" font-weight="bold" fill="#fff">OCUPADA</text>
    <text x="235" y="207" font-size="13" fill="#111">Vence: 23:15</text>
    <rect x="235" y="215" width="155" height="28" fill="#fff" stroke="#555"/>
    <text x="275" y="234" font-size="13" fill="#222">Check-out</text>
  </g>
  <g>
    <rect x="420" y="105" width="185" height="150" fill="url(#rayado)" stroke="#555" stroke-width="2"/>
    <text x="435" y="135" font-size="20" font-weight="bold" fill="#222">Hab. 3</text>
    <text x="435" y="155" font-size="12" fill="#444">Estándar</text>
    <rect x="435" y="168" width="115" height="22" fill="#fff" stroke="#555"/>
    <text x="443" y="184" font-size="12" font-weight="bold" fill="#222">EN LIMPIEZA</text>
    <text x="435" y="207" font-size="13" fill="#222">Desde: 21:20</text>
    <rect x="435" y="215" width="155" height="28" fill="#fff" stroke="#555"/>
    <text x="447" y="234" font-size="13" fill="#222">Marcar como libre</text>
  </g>
  <g>
    <rect x="620" y="105" width="185" height="150" fill="#d6d6d6" stroke="#555" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="635" y="135" font-size="20" font-weight="bold" fill="#222">Hab. 4</text>
    <text x="635" y="155" font-size="12" fill="#444">Suite</text>
    <rect x="635" y="168" width="105" height="22" fill="#fff" stroke="#555" stroke-dasharray="4 2"/>
    <text x="643" y="184" font-size="12" font-weight="bold" fill="#222">RESERVADA</text>
    <text x="635" y="207" font-size="13" fill="#222">Llega: 22:00 · "Luna"</text>
    <rect x="635" y="215" width="155" height="28" fill="#fff" stroke="#555"/>
    <text x="645" y="234" font-size="13" fill="#222">Check-in reserva</text>
  </g>

  <!-- Fila 2 -->
  <g>
    <rect x="20" y="270" width="185" height="150" fill="#9e9e9e" stroke="#333" stroke-width="2"/>
    <text x="35" y="300" font-size="20" font-weight="bold" fill="#111">Hab. 5</text>
    <text x="35" y="320" font-size="12" fill="#222">Estándar</text>
    <rect x="35" y="333" width="90" height="22" fill="#555" stroke="#333"/>
    <text x="45" y="349" font-size="12" font-weight="bold" fill="#fff">OCUPADA</text>
    <text x="35" y="372" font-size="13" font-weight="bold" fill="#111">Vence: 21:35 ⚠ vencida</text>
    <rect x="35" y="380" width="155" height="28" fill="#fff" stroke="#555"/>
    <text x="75" y="399" font-size="13" fill="#222">Check-out</text>
  </g>
  <g>
    <rect x="220" y="270" width="185" height="150" fill="#ffffff" stroke="#555" stroke-width="2"/>
    <text x="235" y="300" font-size="20" font-weight="bold" fill="#222">Hab. 6</text>
    <text x="235" y="320" font-size="12" fill="#666">Estándar</text>
    <rect x="235" y="333" width="80" height="22" fill="#fff" stroke="#555"/>
    <text x="248" y="349" font-size="12" font-weight="bold" fill="#222">LIBRE</text>
    <rect x="235" y="375" width="155" height="30" fill="#e0e0e0" stroke="#777"/>
    <text x="278" y="395" font-size="13" fill="#222">Check-in</text>
  </g>
  <g>
    <rect x="420" y="270" width="185" height="150" fill="#9e9e9e" stroke="#333" stroke-width="2"/>
    <text x="435" y="300" font-size="20" font-weight="bold" fill="#111">Hab. 7</text>
    <text x="435" y="320" font-size="12" fill="#222">Suite</text>
    <rect x="435" y="333" width="90" height="22" fill="#555" stroke="#333"/>
    <text x="445" y="349" font-size="12" font-weight="bold" fill="#fff">OCUPADA</text>
    <text x="435" y="372" font-size="13" fill="#111">Vence: 00:40</text>
    <rect x="435" y="380" width="155" height="28" fill="#fff" stroke="#555"/>
    <text x="475" y="399" font-size="13" fill="#222">Check-out</text>
  </g>
  <g>
    <rect x="620" y="270" width="185" height="150" fill="#ffffff" stroke="#555" stroke-width="2"/>
    <text x="635" y="300" font-size="20" font-weight="bold" fill="#222">Hab. 8</text>
    <text x="635" y="320" font-size="12" fill="#666">Estándar</text>
    <rect x="635" y="333" width="80" height="22" fill="#fff" stroke="#555"/>
    <text x="648" y="349" font-size="12" font-weight="bold" fill="#222">LIBRE</text>
    <rect x="635" y="375" width="155" height="30" fill="#e0e0e0" stroke="#777"/>
    <text x="678" y="395" font-size="13" fill="#222">Check-in</text>
  </g>

  <!-- Leyenda -->
  <rect x="20" y="440" width="785" height="100" fill="#f7f7f7" stroke="#999"/>
  <text x="35" y="463" font-size="13" font-weight="bold" fill="#333">Leyenda (en el sistema real cada estado tendrá además un color propio)</text>
  <rect x="35" y="478" width="30" height="20" fill="#ffffff" stroke="#555"/>
  <text x="72" y="493" font-size="12" fill="#333">Libre</text>
  <rect x="160" y="478" width="30" height="20" fill="#9e9e9e" stroke="#333"/>
  <text x="197" y="493" font-size="12" fill="#333">Ocupada (con hora de vencimiento)</text>
  <rect x="420" y="478" width="30" height="20" fill="url(#rayado)" stroke="#555"/>
  <text x="457" y="493" font-size="12" fill="#333">En limpieza</text>
  <rect x="570" y="478" width="30" height="20" fill="#d6d6d6" stroke="#555" stroke-dasharray="4 2"/>
  <text x="607" y="493" font-size="12" fill="#333">Reservada (hora de llegada)</text>
  <text x="35" y="525" font-size="12" fill="#555">La grilla se refresca sola cada 15 s. "⚠ vencida" resalta las estadías que superaron su hora de vencimiento.</text>
</svg>
